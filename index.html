<style>
  :root{
    --navy:#101c3d; --navy-2:#1b2b5c; --gold:#f0c24b; --gold-d:#c99a1e;
    --paper:#f7f4ec; --ink:#0a1128; --danger:#ff7a6b;
    --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
    --gutter:clamp(10px,2.4vw,28px);
    --control-gap:clamp(4px,1vw,12px);
    --nav-size:clamp(40px,4.2vw,52px);
    --utility-size:clamp(36px,3.2vw,40px);
    --shutter-size:clamp(64px,6.5vw,80px);
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh;background:var(--navy);color:var(--paper);font-family:var(--font);overflow:hidden}
  #stage{position:fixed;inset:0;background:var(--navy)}

  /* ---------- HUD ---------- */
  .top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + clamp(8px,1vw,12px)) var(--gutter) clamp(12px,2vw,24px);
    background:linear-gradient(to bottom,rgba(10,17,40,.65),transparent);pointer-events:none}
  .brand{font-weight:800;font-size:clamp(14px,1.4vw,17px);letter-spacing:-.01em}
  .brand small{display:block;font-weight:500;font-size:clamp(11px,1vw,12px);opacity:.75;letter-spacing:0}
  .status{display:flex;align-items:center;gap:8px;font-size:clamp(11px,1.1vw,13px);font-weight:700;
    padding:clamp(6px,.7vw,7px) clamp(8px,1vw,12px);border-radius:99px;
    background:rgba(10,17,40,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite}

  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:clamp(20px,4vh,40px) var(--gutter) calc(env(safe-area-inset-bottom,0px) + clamp(12px,2vh,18px));
    background:linear-gradient(to top,rgba(10,17,40,.85) 30%,transparent)}
  .caption{text-align:center;margin-bottom:clamp(8px,1.5vh,14px)}
  .caption b{font-size:clamp(17px,2vw,22px);font-weight:800;letter-spacing:-.01em}
  .caption span{display:block;font-size:clamp(11px,1.1vw,13px);opacity:.8;margin-top:2px}
  .controls{display:flex;align-items:center;justify-content:center;gap:var(--control-gap)}
  .nav{flex:0 0 var(--nav-size);width:var(--nav-size);height:var(--nav-size);border-radius:50%;border:0;color:var(--paper);
    font-size:clamp(20px,2vw,22px);cursor:pointer;

  .nav:active{transform:scale(.92)}
  .utility{flex:0 0 var(--utility-size);width:var(--utility-size);height:var(--utility-size);border:0;border-radius:50%;
    color:var(--paper);font-size:clamp(16px,1.6vw,18px);cursor:pointer;
    background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .utility:active{transform:scale(.92)}
  .utility:disabled{opacity:.4}
  .shutter{flex:0 0 var(--shutter-size);width:var(--shutter-size);height:var(--shutter-size);border-radius:50%;
    border:clamp(3px,.35vw,4px) solid var(--paper);background:transparent;padding:5px;cursor:pointer}
  .shutter i{display:block;width:100%;height:100%;border-radius:50%;background:var(--gold);transition:transform .12s}
  .shutter:active i{transform:scale(.86)}
  .shutter:disabled{opacity:.4}
  .chips{display:flex;justify-content:center;gap:clamp(6px,.7vw,8px);margin-top:clamp(8px,1.5vh,14px)}
  .chip{width:clamp(7px,.8vw,9px);height:clamp(7px,.8vw,9px);border-radius:99px;background:rgba(255,255,255,.35);transition:.2s}
  .chip.on{width:clamp(20px,2.3vw,26px);background:var(--gold)}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  /* ---------- Overlay (loading / error) ---------- */
  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:clamp(16px,4vw,32px);text-align:center;
    background:radial-gradient(120% 90% at 50% 0%,var(--navy-2),var(--navy))}
  .overlay.hide{display:none}
  .card{width:min(100%,380px)}
  .emoji{font-size:clamp(42px,6vw,56px);margin-bottom:14px}
  .card h1{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  .card p{font-size:clamp(14px,1.6vw,16px);line-height:1.55;opacity:.85}
  .card ol{text-align:left;font-size:clamp(13px,1.4vw,14px);line-height:1.6;margin:14px 0 0 20px;opacity:.9}
  .btn{margin-top:22px;border:0;border-radius:14px;padding:clamp(11px,1.3vw,14px) clamp(16px,2vw,22px);
    font:700 clamp(14px,1.5vw,16px) var(--font);
    background:var(--gold);color:var(--ink);cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.14);color:var(--paper);margin-left:8px}
  .spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);
    margin:0 auto 18px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Preview foto ---------- */
  .flash{position:fixed;inset:0;z-index:15;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .35s ease-out}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}
  .preview{position:fixed;inset:0;z-index:18;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2vw,18px);padding:clamp(12px,2vw,20px);background:rgba(10,17,40,.92)}
  .preview.show{display:flex}
  .preview img{max-width:min(100%,900px);max-height:68vh;max-height:68dvh;border-radius:18px;border:3px solid var(--paper);
    box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .row{display:flex;gap:clamp(8px,1.2vw,10px)}
  .row .btn{margin:0}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);z-index:25;
    max-width:calc(100vw - var(--gutter) - var(--gutter));text-align:center;background:var(--paper);color:var(--ink);font-weight:700;
    font-size:clamp(12px,1.2vw,14px);padding:clamp(8px,1vw,10px) clamp(12px,1.6vw,16px);border-radius:99px;
    opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){.dot,.spinner{animation:none}}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MindARThree } from 'mindar-face-three';

const $ = id => document.getElementById(id);
const STORAGE_KEY = 'ar-wisuda:filter-terakhir';

/* =====================================================
   1. MODEL FALLBACK (dibuat dengan kode jika .glb belum ada)
   ===================================================== */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .45, metalness: .1, ...o });
const GOLD = () => mat(0xf0c24b, { metalness: .85, roughness: .25 });

function buatToga() {
  const g = new THREE.Group();
  const navy = mat(0x14204a, { roughness: .8 });

  const base = new THREE.Mesh(new THREE.CylinderGeometry(.6, .66, .5, 32), navy);
  base.position.y = -.1; g.add(base);

  const board = new THREE.Mesh(new THREE.BoxGeometry(2, .08, 2), navy);
  board.position.y = .2; board.rotation.y = Math.PI / 4; g.add(board);

  const button = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .06, 16), GOLD());
  button.position.y = .27; g.add(button);

  // Tali kuncir: pivot di tengah papan, ayunan dihitung tiap frame
  const pivot = new THREE.Group(); pivot.position.set(0, .27, 0); g.add(pivot);
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, 1.0, 8), GOLD());
  cord.position.set(.5, 0, 0); cord.rotation.z = Math.PI / 2; pivot.add(cord);
  const swing = new THREE.Group(); swing.position.set(1.0, 0, 0); pivot.add(swing);
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .4, 8), GOLD());
  rope.position.y = -.2; swing.add(rope);
  const tassel = new THREE.Mesh(new THREE.ConeGeometry(.1, .35, 16), GOLD());
  tassel.position.y = -.55; tassel.rotation.x = Math.PI; swing.add(tassel);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 12), GOLD());
  knob.position.y = -.38; swing.add(knob);

  return { object: g, contactY: .35, update: t => {
    swing.rotation.z = Math.sin(t * 3.2) * .38;
    swing.rotation.x = Math.cos(t * 2.4) * .18;
  }};
}

function buatKacamata() {
  const g = new THREE.Group();
  const frame = GOLD();
  const lens = mat(0x7fd6ff, { transparent: true, opacity: .52, metalness: .3, roughness: .1 });
  const eyes = [];
  [-1, 1].forEach(() => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.33, .05, 12, 40), frame);
    g.add(ring);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(.33, 32), lens);
    g.add(glass);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .9, 8), frame);
    g.add(arm);
    eyes.push({ ring, glass, arm });
  });
  const bridge = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .22, 8), frame);
  g.add(bridge);

  // Bintang berkilau yang mengorbit
  const stars = [];
  for (let i = 0; i < 5; i++) {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(.07 + (i % 2) * .03), mat(0xfff2b0, { emissive: 0xf0c24b, emissiveIntensity: .8 }));
    g.add(s); stars.push(s);
  }
  let center = new THREE.Vector3(), eyeSpan = 0, eyeWidth = 0, forward = 0;
  return {
    object: g,
    fitToEyes(points, ratio) {
      const midpoint = (a, b) => a.clone().add(b).multiplyScalar(.5);
      const leftCenter = midpoint(points.leftEye, points.leftEyeInner);
      const rightCenter = midpoint(points.rightEye, points.rightEyeInner);
      const widths = [
        points.leftEye.distanceTo(points.leftEyeInner),
        points.rightEye.distanceTo(points.rightEyeInner)
      ];
      eyeWidth = (widths[0] + widths[1]) / 2;
      eyeSpan = leftCenter.distanceTo(rightCenter);
      center = midpoint(leftCenter, rightCenter);
      forward = eyeWidth * .08;

      [
        { outer: points.leftEye, inner: points.leftEyeInner, center: leftCenter, fit: eyes[0] },
        { outer: points.rightEye, inner: points.rightEyeInner, center: rightCenter, fit: eyes[1] }
      ].forEach(({ outer, inner, center: eyeCenter, fit }) => {
        const width = outer.distanceTo(inner);
        const angle = Math.atan2(inner.y - outer.y, inner.x - outer.x);
        fit.ring.position.set(eyeCenter.x, eyeCenter.y, eyeCenter.z + forward);
        fit.ring.rotation.z = angle;
        fit.ring.scale.set(width * 1.45 * ratio / .74, width * 1.12 * ratio / .74, 1);
        fit.glass.position.set(eyeCenter.x, eyeCenter.y, eyeCenter.z + forward + .005);
        fit.glass.rotation.z = angle;
        fit.glass.scale.set(width * 1.4 * ratio / .66, width * .98 * ratio / .66, 1);

        const side = Math.sign(outer.x - inner.x);
        const armLength = width * 1.8 * ratio;
        fit.arm.position.set(
          outer.x + side * width * .2,
          outer.y,
          outer.z + forward - armLength / 2
        );
        fit.arm.rotation.set(Math.PI / 2, 0, 0);
        fit.arm.scale.set(1, armLength / .9, 1);
      });

      const innerLeft = points.leftEyeInner, innerRight = points.rightEyeInner;
      const bridgeVector = innerRight.clone().sub(innerLeft);
      const bridgeLength = bridgeVector.length();
      bridge.position.copy(midpoint(innerLeft, innerRight));
      bridge.position.z += forward;
      bridge.rotation.z = Math.atan2(bridgeVector.y, bridgeVector.x) - Math.PI / 2;
      bridge.scale.set(1, bridgeLength * ratio / .22, 1);
    },
    update: t => {
      const starScale = eyeWidth * .7;
      stars.forEach((s, i) => {
        const a = t * 1.8 + (i / stars.length) * Math.PI * 2;
        s.position.set(
          center.x + Math.cos(a) * eyeSpan * .45,
          center.y + Math.sin(a * 1.3) * eyeWidth * .35,
          center.z + forward
        );
        s.rotation.set(t * 3 + i, t * 2, 0);
        s.scale.setScalar(starScale * (.8 + Math.sin(t * 5 + i * 1.7) * .2));
      });
    }
  };
}

const FALLBACKS = { toga: buatToga, kacamata: buatKacamata };

function buatLalat() {
  const group = new THREE.Group();
  const hitam = mat(0x241d24, { metalness: .15, roughness: .55 });
  const sayapMat = new THREE.MeshStandardMaterial({ color: 0xe7f5ff, transparent: true, opacity: .8, roughness: .2 });
  const badan = new THREE.Mesh(new THREE.SphereGeometry(.13, 16, 12), hitam);
  badan.scale.set(1.35, .8, .75);
  group.add(badan);

  const kepala = new THREE.Mesh(new THREE.SphereGeometry(.085, 14, 12), hitam);
  kepala.position.x = .18; group.add(kepala);
  const mataMat = mat(0xffffff, { emissive: 0x777777 });
  [-1, 1].forEach(side => {
    const mata = new THREE.Mesh(new THREE.SphereGeometry(.025, 8, 8), mataMat);
    mata.position.set(.22, .025, side * .06); group.add(mata);
  });

  const wings = [-1, 1].map(side => {
    const wing = new THREE.Mesh(new THREE.SphereGeometry(.12, 12, 8), sayapMat);
    wing.scale.set(1, .35, .65);
    wing.position.set(-.015, .105, side * .075);
    group.add(wing);
    return wing;
  });
  return { group, wings };
}

function buatKepalanTangan() {
  const group = new THREE.Group();
  const sarung = mat(0xf0c24b, { roughness: .38 });
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(.13, .16, .22, 12), mat(0x26366e));
  cuff.rotation.z = Math.PI / 2;
  cuff.position.x = -.21;
  group.add(cuff);

  const telapak = new THREE.Mesh(new THREE.SphereGeometry(.2, 16, 12), sarung);
  telapak.scale.set(1.15, .95, .9);
  group.add(telapak);
  for (let i = 0; i < 4; i++) {
    const ruas = new THREE.Mesh(new THREE.SphereGeometry(.075, 10, 8), sarung);
    ruas.position.set(.12, .105 - i * .065, .035);
    group.add(ruas);
  }
  const ibuJari = new THREE.Mesh(new THREE.SphereGeometry(.09, 10, 8), sarung);
  ibuJari.position.set(.02, -.12, .13);
  ibuJari.rotation.z = -.55;
  group.add(ibuJari);
  return group;
}

function buatEfekTinju() {
  const group = new THREE.Group();
  const kepalan = buatKepalanTangan();
  group.add(kepalan);

  const kilau = new THREE.Group();
  const material = mat(0xfff2a6, { emissive: 0xf0c24b, emissiveIntensity: 1.3 });
  for (let i = 0; i < 5; i++) {
    const bintang = new THREE.Mesh(new THREE.OctahedronGeometry(.075), material);
    const sudut = i / 5 * Math.PI * 2;
    bintang.position.set(Math.cos(sudut) * .38, Math.sin(sudut) * .32, .04);
    kilau.add(bintang);
  }
  kilau.visible = false;
  group.add(kilau);
  return { group, kepalan, kilau };
}

/* =====================================================
   2. STATE & ELEMEN
   ===================================================== */
let config, mindar, renderer, scene, camera;
let filters = [];          // { data, groups:[{group, update, mixer}] }
let aktif = 0;
const clock = new THREE.Clock();
let started = false, lastPhoto = null;
let suaraAktif = false, kameraSwitching = false, audioContext = null;
let handTracker = null, handInferenceRunning = false, handInferenceErrorShown = false;
let lastHandInference = 0, fistFrames = 0, cameraDetectionTimer = null;
let faceDetected = false;
let faceFlag = false;      // diisi oleh controller MindAR setiap frame (true = ada wajah)
let efekWajah;

/* =====================================================
   3. MUAT MODEL (GLB, jika gagal pakai fallback)
   ===================================================== */
const loader = new GLTFLoader();
function muatGLB(url) {
  return new Promise((ok, err) => loader.load(url, ok, undefined, err));
}

async function buatAksesori(a, anchorGroup) {
  const wrapper = new THREE.Group();
  const posisiDasar = new THREE.Vector3(...a.posisi);
  let update = () => {}, mixer = null;
  let fitToEyes = null;
  let contactY = null;

  try {
    const gltf = await muatGLB(a.model);
    wrapper.add(gltf.scene);
    if (gltf.animations?.length) {            // animasi bawaan GLB
      mixer = new THREE.AnimationMixer(gltf.scene);
      gltf.animations.forEach(c => mixer.clipAction(c).play());
    }
  } catch {
    const fb = FALLBACKS[a.fallback]();       // model buatan kode
    wrapper.add(fb.object);
    update = fb.update;
    fitToEyes = fb.fitToEyes || null;
    contactY = fb.contactY ?? null;
  }

  wrapper.position.copy(posisiDasar);
  wrapper.rotation.set(...a.rotasi);
  wrapper.scale.setScalar(a.skala);
  wrapper.visible = false;
  anchorGroup.add(wrapper);
  return {
    group: wrapper, update, mixer,
    fitToFace(points) {
      const local = point => anchorGroup.worldToLocal(point.clone());
      if (a.fit === 'eyes' && fitToEyes) {
        wrapper.position.set(0, 0, 0);
        wrapper.scale.setScalar(1);
        fitToEyes({
          leftEye: local(points.leftEye),
          rightEye: local(points.rightEye),
          leftEyeInner: local(points.leftEyeInner),
          rightEyeInner: local(points.rightEyeInner)
        }, a.skala);
        return;
      }
      if (a.fit === 'head') {
        const headWidth = local(points.leftCheek).distanceTo(local(points.rightCheek));
        if (!Number.isFinite(headWidth) || headWidth <= 0) return;
        const unit = headWidth / 2.828;
        const scale = a.skala * unit * 1.1;
        wrapper.position.set(
          posisiDasar.x * unit,
          contactY === null ? posisiDasar.y * unit : contactY * scale,
          posisiDasar.z * unit
        );
        wrapper.scale.setScalar(scale);
      } else if (a.fit === 'eyes') {
        const leftEye = local(points.leftEye);
        const rightEye = local(points.rightEye);
        const eyeSpan = leftEye.distanceTo(rightEye);
        const eyeWidth = (
          leftEye.distanceTo(local(points.leftEyeInner)) +
          rightEye.distanceTo(local(points.rightEyeInner))
        ) / 2;
        if (!Number.isFinite(eyeSpan) || eyeSpan <= 0 || !Number.isFinite(eyeWidth) || eyeWidth <= 0) return;
        const xUnit = eyeSpan / 1.7;
        const yUnit = eyeWidth / .74;
        wrapper.position.set(posisiDasar.x * xUnit, posisiDasar.y * yUnit, posisiDasar.z * yUnit);
        wrapper.scale.set(xUnit * a.skala, yUnit * a.skala, yUnit * a.skala);
      }
    }
  };
}

async function pastikanAksesKamera() {
  if (!window.isSecureContext) {
    const error = new Error('Kamera membutuhkan HTTPS atau localhost.');
    error.name = 'InsecureContextError';
    throw error;
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    const error = new Error('Browser tidak menyediakan akses kamera.');
    error.name = 'NotSupportedError';
    throw error;
  }
}

async function mulaiPelacakanTangan() {
  if (typeof window.Hands !== 'function') {
    throw new Error('Model pelacakan tangan tidak berhasil dimuat.');
  }
  const tracker = new window.Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
  });
  tracker.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,
    minDetectionConfidence: .65,
    minTrackingConfidence: .55
  });
  tracker.onResults(hasilPelacakanTangan);
  try {
    await tracker.send({ image: mindar.video });
    handTracker = tracker;
  } catch (error) {
    throw error;
  }
}

function tutupPelacakanWajah(ctrl) {
  try {
    ctrl?.faceMeshHelper?.faceLandmarker?.close?.();
  } catch (error) {
    console.warn('Model pelacakan wajah lama tidak dapat ditutup:', error);
  }
}

/* =====================================================
   4. INISIALISASI AR
   ===================================================== */
async function init() {
  config = await (await fetch('filters.json')).json();

  // Jika init() dipanggil ulang (mis. tombol "Coba lagi" setelah izin kamera ditolak),
  // bersihkan sisa percobaan sebelumnya agar filter dan canvas tidak dobel.
  renderer?.setAnimationLoop(null);
  if (mindar) {
    mindar.controller.__dead = true;
    mindar.controller.stopProcessVideo?.();
    mindar.video?.srcObject?.getTracks?.().forEach(track => track.stop());
    mindar.video?.remove();
    tutupPelacakanWajah(mindar.controller);
  }
  $('stage').innerHTML = '';
  filters = [];

  mindar = new MindARThree({ container: $('stage'), uiLoading: 'no', uiScanning: 'no' });
  pasangPembukaKamera(mindar);
  gunakanUlangFaceLandmarker(mindar.controller);
  siapkanController(mindar.controller);
  ({ renderer, scene, camera } = mindar);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 1.1));
  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(1, 2, 3); scene.add(dir);

  // Satu anchor per titik wajah yang dipakai
  const anchors = {};
  const getAnchor = idx => anchors[idx] ??= mindar.addAnchor(idx);

  const mulutAtas = getAnchor(13).group;
  const mulutBawah = getAnchor(14).group;
  const mataKiri = getAnchor(33).group;
  const mataKanan = getAnchor(263).group;
  const sudutDalamMataKiri = getAnchor(133).group;
  const sudutDalamMataKanan = getAnchor(362).group;
  const pipiKiri = getAnchor(234).group;
  const pipiKanan = getAnchor(454).group;
  const anchorTinju = getAnchor(168).group;
  const efekLalat = buatLalat();
  const efekTinju = buatEfekTinju();
  mulutAtas.add(efekLalat.group);
  anchorTinju.add(efekTinju.group);
  efekLalat.group.visible = false;
  efekTinju.group.visible = false;
  efekLalat.group.scale.setScalar(.7);

  for (const f of config.filters) {
    const groups = [];
    for (const a of f.aksesori) groups.push(await buatAksesori(a, getAnchor(a.anchor).group));
    filters.push({ data: f, groups });
  }

  efekWajah = {
    fly: { ...efekLalat, active: false, startedAt: 0, cooldownUntil: 0, armed: true, faceScale: 1 },
    punch: { ...efekTinju, active: false, startedAt: 0, cooldownUntil: 0, armed: true, direction: 1, faceScale: 1 },
    fist: { cooldownUntil: 0, armed: true },
    mouthUpper: mulutAtas,
    mouthLower: mulutBawah,
    leftEye: mataKiri,
    rightEye: mataKanan,
    leftEyeInner: sudutDalamMataKiri,
    rightEyeInner: sudutDalamMataKanan,
    leftCheek: pipiKiri,
    rightCheek: pipiKanan,
    punchAnchor: anchorTinju
  };

  await pastikanAksesKamera();
  await mindar.start();                       // minta izin kamera di sini
  started = true;
  $('cameraSwitch').disabled = false;
  updateCameraSwitchButton();

  const saved = localStorage.getItem(STORAGE_KEY);
  const idx = filters.findIndex(f => f.data.id === saved);
  pilihFilter(idx >= 0 ? idx : 0);

  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta(), t = clock.elapsedTime;
    const faceFound = faceFlag;
    if (faceFound !== faceDetected) setStatus(faceFound);
    if (faceFound && handTracker && t - lastHandInference >= .33) {
      lastHandInference = t;
      prosesFrameTangan();
    } else if (!faceFound) fistFrames = 0;
    filters[aktif].groups.forEach(g => { g.update(t); g.mixer?.update(dt); });
    updateEfekWajah(t, faceFound);
    renderer.render(scene, camera);
  });

  $('loading').classList.add('hide');
  $('shutter').disabled = false;
  mulaiPelacakanTangan().catch(error => {
    console.error(error);
    toast('Deteksi kepalan tangan tidak tersedia');
  });
}

function setStatus(found) {
  faceDetected = found;
  $('status').classList.toggle('found', found);
  $('statusText').textContent = found ? 'Wajah terdeteksi' : 'Mencari wajah';
}

function updateEfekWajah(t, faceFound) {
  if (!efekWajah || !faceFound) {
    if (efekWajah) {
      efekWajah.fly.active = false;
      efekWajah.fly.group.visible = false;
      efekWajah.fly.armed = true;
      efekWajah.punch.active = false;
      efekWajah.punch.group.visible = false;
      efekWajah.punch.kilau.visible = false;
      efekWajah.punch.armed = true;
      efekWajah.fist.armed = true;
    }
    return;
  }

  scene.updateMatrixWorld(true);
  const point = group => group.getWorldPosition(new THREE.Vector3());
  const facePoints = {
    leftEye: point(efekWajah.leftEye),
    rightEye: point(efekWajah.rightEye),
    leftEyeInner: point(efekWajah.leftEyeInner),
    rightEyeInner: point(efekWajah.rightEyeInner),
    leftCheek: point(efekWajah.leftCheek),
    rightCheek: point(efekWajah.rightCheek)
  };
  filters[aktif].groups.forEach(g => g.fitToFace(facePoints));
  const lipGap = point(efekWajah.mouthUpper).distanceTo(point(efekWajah.mouthLower));
  const eyeLeft = facePoints.leftEye;
  const eyeRight = facePoints.rightEye;
  const faceWidth = eyeLeft.distanceTo(eyeRight);
  const faceScaleAt = anchor => {
    const left = anchor.worldToLocal(eyeLeft.clone());
    const right = anchor.worldToLocal(eyeRight.clone());
    const scale = left.distanceTo(right) / .6;
    return Number.isFinite(scale) && scale > 0 ? scale : 1;
  };
  efekWajah.fly.faceScale = faceScaleAt(efekWajah.mouthUpper);
  efekWajah.punch.faceScale = faceScaleAt(efekWajah.punchAnchor);
  efekWajah.punch.group.scale.setScalar(efekWajah.punch.faceScale);
  const mouthRatio = faceWidth > 0 ? lipGap / faceWidth : 0;
  const mouthOpen = mouthRatio > .12;

  if (!mouthOpen) efekWajah.fly.armed = true;
  if (mouthOpen && efekWajah.fly.armed && !efekWajah.fly.active && t >= efekWajah.fly.cooldownUntil) {
    efekWajah.fly.active = true;
    efekWajah.fly.armed = false;
    efekWajah.fly.startedAt = t;
    efekWajah.fly.cooldownUntil = t + 1.8;
    efekWajah.fly.group.visible = true;
    mainkanEfekSuara('fly');
    const scale = efekWajah.fly.faceScale;
    efekWajah.fly.group.position.set(-.72 * scale, .12 * scale, .48 * scale);
  }

  if (efekWajah.fly.active) {
    const progress = (t - efekWajah.fly.startedAt) / .85;
    const travel = Math.min(progress, 1);
    const ease = 1 - (1 - travel) ** 3;
    const scale = efekWajah.fly.faceScale;
    efekWajah.fly.group.position.set(
      THREE.MathUtils.lerp(-.72 * scale, 0, ease),
      THREE.MathUtils.lerp(.12 * scale, -.025 * scale, ease) + Math.sin(t * 24) * .025 * scale * (1 - travel),
      THREE.MathUtils.lerp(.48 * scale, -.12 * scale, ease)
    );
    efekWajah.fly.group.rotation.y = Math.sin(t * 12) * .22;
    efekWajah.fly.wings.forEach((wing, i) => {
      wing.rotation.x = Math.sin(t * 48 + i * Math.PI) * .65;
    });
    efekWajah.fly.group.scale.setScalar(.7 * scale * (1 - .55 * ease));
    if (progress >= 1.05) {
      efekWajah.fly.active = false;
      efekWajah.fly.group.visible = false;
    }
  }

  const dx = eyeRight.x - eyeLeft.x;
  const dy = eyeRight.y - eyeLeft.y;
  let roll = Math.atan2(dy, dx);
  if (roll > Math.PI / 2) roll -= Math.PI;
  if (roll < -Math.PI / 2) roll += Math.PI;
  const tilt = Math.abs(roll);

  if (tilt < .14) efekWajah.punch.armed = true;
  if (tilt > .34 && efekWajah.punch.armed && !efekWajah.punch.active && t >= efekWajah.punch.cooldownUntil) {
    efekWajah.punch.active = true;
    efekWajah.punch.armed = false;
    efekWajah.punch.startedAt = t;
    efekWajah.punch.cooldownUntil = t + 1.4;
    efekWajah.punch.direction = roll >= 0 ? 1 : -1;
    efekWajah.punch.group.visible = true;
    efekWajah.punch.kilau.visible = false;
    mainkanEfekSuara('punch');
  }

  if (efekWajah.punch.active) {
    const progress = t - efekWajah.punch.startedAt;
    const direction = efekWajah.punch.direction;
    if (progress < .2) {
      const hit = 1 - (1 - progress / .2) ** 3;
      efekWajah.punch.kepalan.position.set(
        THREE.MathUtils.lerp(direction * 1.05, -direction * .08, hit),
        .12 + Math.sin(hit * Math.PI) * .08,
        .52
      );
    } else {
      const recoil = Math.min((progress - .2) / .28, 1);
      efekWajah.punch.kepalan.position.set(
        THREE.MathUtils.lerp(-direction * .08, direction * .72, recoil),
        .12 - recoil * .12,
        .52
      );
    }
    efekWajah.punch.kilau.visible = progress >= .16 && progress < .62;
    efekWajah.punch.kilau.rotation.z = progress * 5;
    efekWajah.punch.kilau.scale.setScalar(1 + Math.sin(progress * 35) * .12);
    if (progress >= .58) {
      efekWajah.punch.active = false;
      efekWajah.punch.group.visible = false;
      efekWajah.punch.kilau.visible = false;
    }
  }
}

function prosesFrameTangan() {
  const video = mindar.video;
  if (!handTracker || kameraSwitching || handInferenceRunning || !video || video.readyState < 2) return;
  handInferenceRunning = true;
  handTracker.send({ image: video })
    .catch(error => {
      if (!handInferenceErrorShown) {
        console.error(error);
        toast('Pelacakan tangan terhenti');
        handInferenceErrorShown = true;
      }
    })
    .finally(() => { handInferenceRunning = false; });
}

function hasilPelacakanTangan(results) {
  if (kameraSwitching) return;
  const landmarks = results.multiHandLandmarks || [];
  const mengepal = landmarks.some(hand => {
    const wrist = hand[0];
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const fingers = [[8, 6], [12, 10], [16, 14], [20, 18]];
    const curled = fingers.filter(([tip, pip]) =>
      distance(hand[tip], wrist) < distance(hand[pip], wrist) * 1.1
    ).length;
    return curled >= 3;
  });

  if (!mengepal) {
    fistFrames = 0;
    if (efekWajah) efekWajah.fist.armed = true;
    return;
  }
  fistFrames = Math.min(fistFrames + 1, 2);
  if (fistFrames >= 2) mulaiEfekKepalan();
}

function mulaiEfekKepalan() {
  const fist = efekWajah?.fist;
  const t = clock.elapsedTime;
  if (!fist || !faceDetected || !fist.armed || t < fist.cooldownUntil) return;
  fist.armed = false;
  fist.cooldownUntil = t + 1.4;
  serukanHidupJokowi();
}

function aktifkanAudio() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return false;
  if (!audioContext) audioContext = new AudioContextClass();
  if (audioContext.state !== 'running') {
    audioContext.resume().catch(error => {
      console.error(error);
      toast('Audio tidak dapat diaktifkan');
    });
  }
  return true;
}

function mainkanEfekSuara(jenis) {
  if (!suaraAktif || !audioContext || audioContext.state !== 'running') return;
  const now = audioContext.currentTime;
  const nada = (awal, akhir, durasi, volume, tipe) => {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = tipe;
    oscillator.frequency.setValueAtTime(awal, now);
    oscillator.frequency.exponentialRampToValueAtTime(akhir, now + durasi);
    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + .01);
    gain.gain.exponentialRampToValueAtTime(.0001, now + durasi);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(now);
    oscillator.stop(now + durasi);
  };

  if (jenis === 'punch') {
    nada(135, 45, .18, .38, 'sine');
    nada(300, 85, .11, .08, 'triangle');
  } else {
    nada(180, 420, .14, .045, 'sawtooth');
    nada(420, 220, .3, .035, 'sawtooth');
  }
}

function serukanHidupJokowi() {
  if (!suaraAktif || !('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return;
  window.speechSynthesis.cancel();
  const seruan = new SpeechSynthesisUtterance('Hidup Jokowi!');
  seruan.lang = 'id-ID';
  seruan.rate = 1.05;
  seruan.pitch = 1;
  seruan.volume = .85;
  const suaraIndonesia = window.speechSynthesis.getVoices()
    .find(voice => voice.lang.toLowerCase().startsWith('id'));
  if (suaraIndonesia) seruan.voice = suaraIndonesia;
  window.speechSynthesis.speak(seruan);
}
$('soundToggle').onclick = () => {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
    return toast('Browser ini tidak mendukung suara otomatis');
  }
  suaraAktif = !suaraAktif;
  $('soundToggle').textContent = suaraAktif ? '🔊' : '🔇';
  $('soundToggle').setAttribute('aria-label', suaraAktif ? 'Matikan suara' : 'Aktifkan suara');
  $('soundToggle').title = suaraAktif ? 'Suara aktif' : 'Aktifkan suara';
  if (suaraAktif) {
    if (!aktifkanAudio()) toast('Efek suara tidak didukung browser ini');
    serukanHidupJokowi();
  }
  else window.speechSynthesis.cancel();
};

/* =====================================================
   5. GANTI FILTER
   ===================================================== */
function pilihFilter(i) {
  aktif = (i + filters.length) % filters.length;
  filters.forEach((f, n) => f.groups.forEach(g => g.group.visible = n === aktif));
  const d = filters[aktif].data;
  $('fName').textContent = `${d.ikon} ${d.nama}`;
  $('fDesc').textContent = d.deskripsi;
  $('chips').innerHTML = filters.map((_, n) => `<span class="chip${n === aktif ? ' on' : ''}"></span>`).join('');
  try { localStorage.setItem(STORAGE_KEY, d.id); } catch {}   // fitur pilihan: filter terakhir tersimpan
}
$('prev').onclick = () => pilihFilter(aktif - 1);
$('next').onclick = () => pilihFilter(aktif + 1);

/* =====================================================
   6. AMBIL FOTO (video + model 3D digabung)
   ===================================================== */
function ambilFoto() {
  const video = mindar.video, glCanvas = renderer.domElement, box = $('stage').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio, 2);
  const c = document.createElement('canvas');
  c.width = Math.round(box.width * dpr); c.height = Math.round(box.height * dpr);
  const ctx = c.getContext('2d');

  renderer.render(scene, camera);             // pastikan buffer WebGL masih segar

  const mirrored = [video, glCanvas].some(el => {
    const tr = getComputedStyle(el).transform;
    return tr && tr !== 'none' && /^matrix\(-/.test(tr);
  });
  if (mirrored) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }

  [video, glCanvas].forEach(el => {
    // getBoundingClientRect sudah memperhitungkan flip, jadi pakai offsetLeft/Top/Width/Height
    const x = (parseFloat(el.style.left) || 0) * dpr, y = (parseFloat(el.style.top) || 0) * dpr;
    const w = (parseFloat(el.style.width) || box.width) * dpr, h = (parseFloat(el.style.height) || box.height) * dpr;
    ctx.drawImage(el, x, y, w, h);
  });

  $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');

  c.toBlob(blob => {
    lastPhoto = blob;
    $('previewImg').src = URL.createObjectURL(blob);
    $('preview').classList.add('show');
  }, 'image/png');
}
$('shutter').onclick = ambilFoto;
$('closePreview').onclick = () => $('preview').classList.remove('show');

$('save').onclick = async () => {
  if (!lastPhoto) return;
  const nama = `filter-wisuda-${Date.now()}.png`;
  const file = new File([lastPhoto], nama, { type: 'image/png' });
  try {
    if (navigator.canShare?.({ files: [file] })) {   // iPhone/Android: lembar bagikan → "Simpan Gambar"
      await navigator.share({ files: [file], title: 'Foto Filter Wisuda' });
      return toast('Foto siap disimpan');
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');             // desktop: unduh langsung
  a.href = URL.createObjectURL(lastPhoto); a.download = nama; a.click();
  toast('Foto tersimpan ke perangkat');
};

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* =====================================================
   7. PENANGANAN ERROR (izin kamera ditolak dll.)
   ===================================================== */
function tampilError(e) {
  console.error(e);
  const name = e?.name || '', msg = String(e?.message || e);
  let emoji = '📷', title = 'Kamera tidak bisa dipakai', body = 'Terjadi kesalahan saat memulai kamera.', steps = [];

  if (!window.isSecureContext || name === 'InsecureContextError') {
    emoji = '🔐'; title = 'Butuh koneksi aman (HTTPS)';
    body = 'Browser hanya mengizinkan kamera pada situs HTTPS atau localhost. Jangan buka halaman ini langsung sebagai file.';
    steps = ['Jalankan situs melalui server lokal atau unggah ke hosting HTTPS', 'Buka kembali halaman dari alamat localhost atau https://', 'Ketuk “Coba lagi”'];
  } else if (name === 'NotAllowedError' || /permission|denied/i.test(msg)) {
    emoji = '🔒'; title = 'Izin kamera ditolak';
    body = 'Filter wajah membutuhkan izin untuk kamera yang dipilih. Tidak ada gambar yang dikirim ke server.';
    steps = ['Ketuk ikon kunci/pengaturan di sebelah alamat situs', 'Ubah izin Kamera menjadi “Izinkan”', 'Ketuk “Coba lagi”'];
  } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
    emoji = '🔍'; title = 'Kamera tidak ditemukan';
    body = 'Kamera yang diminta tidak tersedia. Coba pilih kamera lain atau periksa izin kamera.';
  } else if (name === 'NotReadableError') {
    emoji = '⚠️'; title = 'Kamera sedang dipakai';
    body = 'Tutup aplikasi lain yang memakai kamera, lalu coba lagi.';
  } else if (name === 'NotSupportedError') {
    emoji = '🌐'; title = 'Browser tidak mendukung kamera';
    body = 'Buka halaman ini di browser modern yang mendukung akses kamera, seperti Chrome, Edge, atau Safari versi terbaru.';
  }
  $('errEmoji').textContent = emoji; $('errTitle').textContent = title; $('errMsg').textContent = body;
  $('errSteps').innerHTML = steps.map(s => `<li>${s}</li>`).join('');
  $('loading').classList.add('hide'); $('errorBox').classList.remove('hide');
}

/* =====================================================
   8. KAMERA DEPAN / BELAKANG
   ===================================================== */

// Membuka stream kamera. Depan memakai "ideal" (laptop yang tidak punya info facingMode tetap jalan),
// belakang memakai "exact" supaya benar-benar kamera belakang. Kalau tidak ada, error yang JELAS dilempar
// (OverconstrainedError) dan gantiKamera() otomatis kembali ke kamera sebelumnya.
async function ambilStream(facingUser) {
  const ukuran = { width: { ideal: 640 }, height: { ideal: 480 } };
  const buka = facingMode => navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { ...ukuran, facingMode }
  });
  const requestedFacing = facingUser ? { ideal: 'user' } : { exact: 'environment' };
  try {
    return await buka(requestedFacing);
  } catch (error) {
    if (error?.name === 'NotReadableError') {
      await new Promise(r => setTimeout(r, 600));
      try {
        return await buka(requestedFacing);
      } catch (retryError) {
        if (facingUser || !['NotFoundError', 'OverconstrainedError', 'NotReadableError'].includes(retryError?.name)) throw retryError;
        return buka({ ideal: 'environment' });
      }
    }
    if (!facingUser && ['NotFoundError', 'OverconstrainedError'].includes(error?.name)) {
      return buka({ ideal: 'environment' });
    }
    throw error;
  }
}

// Mengganti _startVideo bawaan MindAR. Bedanya: (1) memakai ambilStream() di atas,
// (2) resolusi diatur SEBELUM MindAR membaca ukuran video (kalau resolusi diubah sesudahnya,
// proyeksi 3D meleset), (3) error asli diteruskan sehingga layar error menampilkan penyebab yang benar.
function pasangPembukaKamera(m) {
  m._startVideo = async function () {
    const video = document.createElement('video');
    video.setAttribute('autoplay', '');
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.playsInline = true;
    Object.assign(video.style, { position: 'absolute', top: '0px', left: '0px', zIndex: '-2' });
    this.video = video;
    this.container.appendChild(video);

    if (!navigator.mediaDevices?.getUserMedia) {
      video.remove();
      const error = new Error('Browser tidak menyediakan akses kamera.');
      error.name = 'NotSupportedError';
      throw error;
    }

    let stream;
    let timeout;
    try {
      stream = await ambilStream(this.shouldFaceUser);
      const metadataReady = new Promise((resolve, reject) => {
        timeout = setTimeout(() => {
          const error = new Error('Kamera tidak mengirim metadata video dalam 10 detik.');
          error.name = 'NotReadableError';
          reject(error);
        }, 10000);
        video.addEventListener('loadedmetadata', resolve, { once: true });
        video.addEventListener('error', () => reject(video.error || new Error('Video kamera gagal dimuat.')), { once: true });
      });
      video.srcObject = stream;
      await Promise.all([video.play(), metadataReady]);
      video.setAttribute('width', video.videoWidth);
      video.setAttribute('height', video.videoHeight);
    } catch (error) {
      clearTimeout(timeout);
      stream?.getTracks().forEach(track => track.stop());
      video.srcObject = null;
      video.remove();
      throw error;
    } finally {
      clearTimeout(timeout);
    }
  };
}

// Membungkus onUpdate milik controller: mencatat "ada wajah / tidak" ke faceFlag, dan MEMBUANG
// hasil dari controller lama yang masih berjalan sesaat setelah kamera diganti
// (penyebab efek berkedip/hilang di kamera baru).
function siapkanController(ctrl) {
  ctrl.__dead = false;
  let handler = () => {};
  Object.defineProperty(ctrl, 'onUpdate', {
    configurable: true,
    get: () => handler,
    set: fn => {
      handler = data => {
        if (ctrl.__dead) return;
        faceFlag = Boolean(data?.hasFace);
        fn?.(data);
      };
    }
  });
}

function gunakanUlangFaceLandmarker(ctrl) {
  const setup = ctrl.setup.bind(ctrl);
  ctrl.setup = async flipFace => {
    ctrl.flipFace = flipFace;
    if (!ctrl.faceMeshHelper?.faceLandmarker) await setup(flipFace);
  };
}

async function mulai() {
  $('errorBox').classList.add('hide'); $('loading').classList.remove('hide');
  try {
    if (started) { await mulaiKameraDenganArah(mindar.shouldFaceUser); $('loading').classList.add('hide'); return; }
    await init();
  } catch (e) { tampilError(e); }
}

function updateCameraSwitchButton() {
  if (!mindar) return;
  const label = mindar.shouldFaceUser ? 'Ganti ke kamera belakang' : 'Ganti ke kamera depan';
  $('cameraSwitch').setAttribute('aria-label', label);
  $('cameraSwitch').title = label;
}

async function gantiKamera() {
  if (!started || kameraSwitching) return;
  kameraSwitching = true;
  $('cameraSwitch').disabled = true;
  const facingUserBefore = mindar.shouldFaceUser;
  const facingUserNext = !facingUserBefore;
  try {
    await mulaiKameraDenganArah(facingUserNext);
    toast(facingUserNext ? 'Kamera depan aktif' : 'Kamera belakang aktif - arahkan ke wajah');
  } catch (error) {
    console.error(error);
    try {
      await mulaiKameraDenganArah(facingUserBefore);   // kembali ke kamera sebelumnya
      toast(facingUserNext ? 'Kamera depan tidak tersedia' : 'Kamera belakang tidak tersedia');
    } catch (restartError) {
      tampilError(restartError);
    }
  } finally {
    kameraSwitching = false;
    $('cameraSwitch').disabled = false;
    updateCameraSwitchButton();
  }
}

// Menghentikan kamera yang sedang jalan, lalu menyalakan kamera pada arah yang diminta.
// Berlaku dua arah (depan -> belakang dan belakang -> depan) dengan alur yang sama.
async function mulaiKameraDenganArah(facingUser) {
  clearTimeout(cameraDetectionTimer);
  cameraDetectionTimer = null;
  const lama = mindar.controller;
  const faceMeshHelper = lama.faceMeshHelper;
  lama.__dead = true;
  const videoAktif = mindar.video?.srcObject;
  if (videoAktif) mindar.stop();
  else {
    lama.stopProcessVideo?.();
    mindar.video?.remove();
  }
  faceFlag = false;
  mindar.latestEstimate = null;
  fistFrames = 0;

  const controller = new lama.constructor({
    filterMinCF: lama.filterMinCF,
    filterBeta: lama.filterBeta
  });
  controller.faceMeshHelper = faceMeshHelper;
  gunakanUlangFaceLandmarker(controller);
  siapkanController(controller);
  mindar.controller = controller;

  mindar.shouldFaceUser = facingUser;
  setStatus(false);
  $('statusText').textContent = `Mengaktifkan kamera ${facingUser ? 'depan' : 'belakang'}...`;
  await new Promise(r => setTimeout(r, 250));   // beri waktu perangkat melepas kamera lama
  await mindar.start();
  setStatus(false);
  if (!facingUser) cobaOrientasiDeteksiBelakang();
}

function cobaOrientasiDeteksiBelakang() {
  let percobaan = 0;
  const cobaLagi = () => {
    if (mindar.shouldFaceUser || faceFlag || percobaan >= 2) {
      cameraDetectionTimer = null;
      return;
    }
    percobaan++;
    mindar.controller.flipFace = !mindar.controller.flipFace;
    if (mindar.video) {
      mindar.video.style.transform = mindar.controller.flipFace ? 'scaleX(-1)' : 'scaleX(1)';
    }
    cameraDetectionTimer = setTimeout(cobaLagi, 2500);
  };
  cameraDetectionTimer = setTimeout(cobaLagi, 2500);
}

$('cameraSwitch').onclick = gantiKamera;
$('retry').onclick = mulai;
mulai();
</script>
</body>
</html>
